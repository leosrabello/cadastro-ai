# Local development stack. Production deployment is described in docs/deployment.md.
name: cadastro-ai

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://cadastro:${POSTGRES_PASSWORD}@db:5432/cadastro
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /data/documents
    WATCH_ALLOWED_ROOTS: /watch
  volumes:
    - documents:/data/documents
    - ./watch:/watch
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cadastro
      POSTGRES_USER: cadastro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadastro -d cadastro"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "documents"]
    depends_on:
      api:
        condition: service_started

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      api:
        condition: service_started

  watcher:
    <<: *backend
    command: ["python", "-m", "app.ingestion.watcher"]
    depends_on:
      api:
        condition: service_started


  # Database viewer in the browser, read-only, this computer only: http://localhost:8081
  # Started on demand: docker compose --profile ferramentas up -d dbweb
  dbweb:
    image: sosedoff/pgweb:0.16.2
    profiles: ["ferramentas"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: postgres://leitura:${DB_READONLY_PASSWORD}@db:5432/cadastro?sslmode=disable
    command: ["pgweb", "--bind=0.0.0.0", "--listen=8081", "--readonly"]
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  documents:
