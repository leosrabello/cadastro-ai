[project]
name = "cadastro-ai-backend"
version = "0.1.0"
description = "Cadastro AI — centralized API, workers and folder watcher for registration document analysis"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.41",
  "psycopg[binary]==3.2.9",
  "alembic==1.16.1",
  "pydantic==2.11.5",
  "pydantic-settings==2.9.1",
  "python-multipart==0.0.20",
  "celery[redis]==5.5.3",
  "redis==5.2.1",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "cryptography==45.0.3",
  "pymupdf==1.26.0",
  "pillow==11.2.1",
  "pytesseract==0.3.13",
  "imagehash==4.3.2",
  "numpy==2.2.6",
  "httpx==0.28.1",
  "anthropic>=0.75",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
